<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Анкета / Anketa / Survey — Надёжность персонала</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --green: #0F6E56;
  --green-light: #E1F5EE;
  --green-mid: #1D9E75;
  --green-dark: #085041;
  --ink: #1a1a1a;
  --ink-muted: #555;
  --ink-hint: #999;
  --surface: #fff;
  --bg: #f5f3ef;
  --border: rgba(0,0,0,0.1);
  --border-hover: rgba(0,0,0,0.22);
  --radius: 10px;
  --shadow: 0 2px 12px rgba(0,0,0,0.07);
}
html { scroll-behavior: smooth; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Arial, sans-serif; background: var(--bg); color: var(--ink); min-height: 100vh; font-size: 15px; line-height: 1.6; }
.page { max-width: 720px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }

/* LANG SELECTOR */
.lang-screen {
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg);
}
.lang-box {
  background: var(--surface);
  border-radius: 20px;
  box-shadow: 0 4px 32px rgba(0,0,0,0.1);
  padding: 3rem 2.5rem;
  text-align: center;
  max-width: 440px; width: 100%;
  margin: 1.25rem;
}
.lang-logo {
  width: 56px; height: 56px;
  background: var(--green-light);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 1.5rem;
  font-size: 24px;
}
.lang-title { font-size: 20px; font-weight: 600; color: var(--ink); margin-bottom: 6px; }
.lang-sub { font-size: 13px; color: var(--ink-muted); margin-bottom: 2rem; line-height: 1.6; }
.lang-back { cursor:pointer; display:flex; align-items:center; gap:6px; font-size:13px; color:var(--ink-hint); background:none; border:none; font-family:inherit; margin-bottom:1.25rem; padding:4px 0; transition:color 0.15s; }
.lang-back:hover { color:var(--ink-muted); }
.lang-back svg { flex-shrink:0; }
.lang-btns { display: flex; flex-direction: column; gap: 10px; }
.lang-btn {
  cursor: pointer;
  padding: 14px 20px;
  border: 1.5px solid var(--border-hover);
  border-radius: 12px;
  font-size: 15px;
  font-weight: 500;
  background: transparent;
  color: var(--ink);
  font-family: inherit;
  transition: all 0.18s;
  display: flex; align-items: center; gap: 12px;
}
.lang-btn:hover { border-color: var(--green); background: var(--green-light); color: var(--green-dark); }
.lang-flag { font-size: 22px; }
.lang-name { flex: 1; text-align: left; }
.lang-native { font-size: 12px; color: var(--ink-hint); font-weight: 400; }

/* HERO */
.hero { background: var(--green-dark); color: #fff; border-radius: 16px; padding: 2.5rem 2rem 2rem; margin-bottom: 2rem; position: relative; overflow: hidden; }
.hero::before { content:''; position:absolute; right:-40px; top:-40px; width:200px; height:200px; background:rgba(255,255,255,0.04); border-radius:50%; }
.hero-label { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.5); margin-bottom: 0.75rem; }
.hero h1 { font-size: clamp(17px, 4vw, 22px); font-weight: 500; line-height: 1.35; margin-bottom: 1rem; color: #fff; }
.hero-sub { font-size: 13px; color: rgba(255,255,255,0.65); line-height: 1.6; }
.hero-meta { margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid rgba(255,255,255,0.12); display: flex; gap: 1.5rem; flex-wrap: wrap; }
.hero-chip { font-size: 12px; color: rgba(255,255,255,0.6); display: flex; align-items: center; gap: 5px; }
.lang-switch-btn { display:none; }
.lang-topbar { display:flex; justify-content:flex-end; margin-bottom:0.75rem; }
.lang-change-btn { cursor:pointer; display:inline-flex; align-items:center; gap:8px; padding:9px 18px; background:var(--surface); border:1px solid var(--border-hover); border-radius:24px; font-size:13px; font-weight:500; color:var(--ink-muted); font-family:inherit; box-shadow:var(--shadow); transition:all 0.15s; }
.lang-change-btn:hover { border-color:var(--green); color:var(--green-dark); background:var(--green-light); }
.lang-change-btn .flag { font-size:17px; }

/* PROGRESS */
.progress-wrap { margin-bottom: 1.5rem; }
.progress-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-hint); margin-bottom: 6px; }
.progress-track { height: 3px; background: rgba(0,0,0,0.08); border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--green-mid); border-radius: 3px; transition: width 0.5s cubic-bezier(.4,0,.2,1); }

/* CARD */
.sheet { display: none; }
.sheet.active { display: block; }
.card { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); border: 1px solid var(--border); overflow: hidden; }
.card-header { padding: 1.5rem 1.75rem 1.25rem; border-bottom: 1px solid var(--border); }
.card-badge { display: inline-block; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; background: var(--green-light); color: var(--green-dark); padding: 3px 10px; border-radius: 20px; margin-bottom: 8px; font-weight: 500; }
.card-title { font-size: 16px; font-weight: 500; color: var(--ink); margin-bottom: 5px; }
.card-desc { font-size: 13px; color: var(--ink-muted); }
.card-body { padding: 0 1.75rem; }

/* QUESTIONS */
.q-row { padding: 1rem 0; border-bottom: 1px solid rgba(0,0,0,0.06); }
.q-row:last-child { border-bottom: none; }
.q-text { font-size: 13.5px; color: var(--ink); margin-bottom: 9px; line-height: 1.55; }
.q-num { color: var(--ink-hint); margin-right: 4px; font-size: 12px; }
.opt-group { display: flex; flex-wrap: wrap; gap: 6px; }
.opt-btn { cursor: pointer; padding: 6px 13px; border: 1px solid var(--border-hover); border-radius: 20px; font-size: 12.5px; color: var(--ink-muted); background: transparent; font-family: inherit; transition: all 0.15s; white-space: nowrap; }
.opt-btn:hover { border-color: var(--green-mid); color: var(--green-dark); }
.opt-btn.sel { background: var(--green-light); border-color: var(--green); color: var(--green-dark); font-weight: 500; }
.scale-wrap { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.scale-btn { cursor: pointer; width: 38px; height: 38px; border: 1px solid var(--border-hover); border-radius: 8px; font-size: 13px; font-weight: 500; color: var(--ink-muted); background: transparent; font-family: inherit; transition: all 0.15s; display: flex; align-items: center; justify-content: center; }
.scale-btn.np { font-size: 10px; width: auto; padding: 0 10px; }
.scale-btn:hover { border-color: var(--green-mid); color: var(--green-dark); }
.scale-btn.sel { background: var(--green-light); border-color: var(--green); color: var(--green-dark); }
.scale-hint { font-size: 11px; color: var(--ink-hint); margin-top: 5px; }
.freq-group { display: flex; flex-wrap: wrap; gap: 5px; }
.freq-btn { cursor: pointer; padding: 5px 11px; border: 1px solid var(--border-hover); border-radius: 6px; font-size: 12px; color: var(--ink-muted); background: transparent; font-family: inherit; transition: all 0.15s; }
.freq-btn:hover { border-color: var(--green-mid); color: var(--green-dark); }
.freq-btn.sel { background: var(--green-light); border-color: var(--green); color: var(--green-dark); font-weight: 500; }
input[type=text], textarea { width: 100%; font-family: inherit; font-size: 13.5px; color: var(--ink); background: #fafaf8; border: 1px solid var(--border-hover); border-radius: var(--radius); padding: 9px 12px; outline: none; transition: border-color 0.15s; }
input[type=text]:focus, textarea:focus { border-color: var(--green-mid); background: #fff; }
textarea { min-height: 80px; resize: vertical; line-height: 1.6; }

/* NAV */
.card-nav { display: flex; align-items: center; justify-content: space-between; padding: 1.25rem 1.75rem; border-top: 1px solid var(--border); background: #fafaf8; }
.page-info { font-size: 12px; color: var(--ink-hint); }
.btn { cursor: pointer; padding: 9px 22px; border-radius: 8px; font-size: 13.5px; font-family: inherit; font-weight: 500; border: 1px solid var(--border-hover); background: transparent; color: var(--ink-muted); transition: all 0.15s; }
.btn:hover { background: var(--bg); color: var(--ink); }
.btn-primary { background: var(--green); color: #fff; border-color: var(--green); }
.btn-primary:hover { background: var(--green-dark); border-color: var(--green-dark); color: #fff; }
.btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

/* DONE */
.done-card { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); border: 1px solid var(--border); padding: 3rem 2rem; text-align: center; }
.done-icon { width: 64px; height: 64px; background: var(--green-light); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem; }
.done-title { font-size: 22px; font-weight: 600; margin-bottom: 0.75rem; }
.done-text { font-size: 14px; color: var(--ink-muted); max-width: 380px; margin: 0 auto 1.5rem; line-height: 1.7; }
.done-author { font-size: 12px; color: var(--ink-hint); font-style: italic; margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--border); }

/* SENDING */
.sending-overlay { display: none; position: fixed; inset: 0; background: rgba(255,255,255,0.85); backdrop-filter: blur(4px); z-index: 999; align-items: center; justify-content: center; flex-direction: column; gap: 1rem; }
.sending-overlay.show { display: flex; }
.spinner { width: 36px; height: 36px; border: 3px solid var(--green-light); border-top-color: var(--green); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.sending-text { font-size: 14px; color: var(--green-dark); font-weight: 500; }
.err-banner { display: none; background: #fff0f0; border: 1px solid #fca5a5; border-radius: 8px; padding: 12px 16px; font-size: 13px; color: #991b1b; margin: 0 1.75rem 1rem; }
.err-banner.show { display: block; }

@media (max-width: 500px) {
  .hero { padding: 1.75rem 1.25rem 1.5rem; }
  .card-body { padding: 0 1.25rem; }
  .card-header { padding: 1.25rem 1.25rem 1rem; }
  .card-nav { padding: 1rem 1.25rem; }
  .lang-box { padding: 2rem 1.5rem; }
}
</style>
</head>

</div>
</div>

    open:["List the most typical personnel errors you have observed at the workplace (2–3 examples):","What organisational, technical or psychological factors are the main causes of these errors?","What human factor reduction measures do you consider most effective and implementable in your organisation?","What changes to the training, preparation or admission system should be made as a priority?","Do you have suggestions for improving ACS/workstations to reduce the probability of operator errors?","Any other observations and suggestions on reliability and error-free railway operations:"]
  }
};

// ══════════════════════════════════════
// STATE
// ══════════════════════════════════════
let lang = 'ru';
let currentSheet = 0;
const TOTAL = 8;
const answers = {};

function selectLang(l) {
  lang = l;
  document.getElementById('langScreen').style.display = 'none';
  document.getElementById('surveyApp').style.display = 'block';
  buildSurvey();
}

function switchLang() {
  document.getElementById('surveyApp').style.display = 'none';
  document.getElementById('langScreen').style.display = 'flex';
  document.getElementById('langBackBtn').style.display = 'flex';
  const backLabels = { ru:'← Назад', uz:'← Orqaga', en:'← Back' };
  document.getElementById('langBackText').textContent = backLabels[lang] || '← Back';
}

function goBackFromLang() {
  document.getElementById('langScreen').style.display = 'none';
  document.getElementById('surveyApp').style.display = 'block';
}

function t(key) { return T[lang][key]; }

function buildSurvey() {
  const L = T[lang];
  document.getElementById('heroLabel').textContent = L.heroLabel;
  document.getElementById('heroTitle').textContent = L.heroTitle;
  document.getElementById('heroSub').textContent = L.heroSub;
  document.getElementById('chip1').textContent = L.chip1;
  document.getElementById('chip2').textContent = L.chip2;
  document.getElementById('chip3').textContent = L.chip3;
  const flags = { ru:'🇷🇺', uz:'🇺🇿', en:'🇬🇧' };
  const changeLbl = { ru:'Сменить язык', uz:'Tilni o\'zgartirish', en:'Change language' };
  document.getElementById('langFlag').textContent = flags[lang];
  document.getElementById('langBtnLabel').textContent = changeLbl[lang];

  const container = document.getElementById('sheetContainer');
  container.innerHTML = '';
  currentSheet = 0;

  L.sheets.forEach((s, i) => {
    const div = document.createElement('div');
    div.className = 'sheet' + (i === 0 ? ' active' : '');
    div.id = 'sheet-' + i;

    let bodyHTML = '';
    if (s.type === 'personal') {
      L.personal.forEach((q, qi) => {
        const key = 's0_' + (qi+1);
        const opts = L.personalOpts[qi];
        let ctrl = opts
          ? `<div class="opt-group" data-q="${key}">${opts.map(o=>`<div class="opt-btn" data-v="${o}">${o}</div>`).join('')}</div>`
          : `<input type="text" data-q="${key}" placeholder="…" value="${answers[key]||''}">`;
        bodyHTML += `<div class="q-row"><div class="q-text"><span class="q-num">${qi+1}.</span>${q}</div>${ctrl}</div>`;
      });
    } else if (s.type === 'open') {
      L.open.forEach((q, qi) => {
        const key = 's7_' + (qi+1);
        bodyHTML += `<div class="q-row"><div class="q-text"><span class="q-num">${qi+1}.</span>${q}</div><textarea data-q="${key}" placeholder="…">${answers[key]||''}</textarea></div>`;
      });
    } else {
      const qs = L[s.key];
      qs.forEach((q, qi) => {
        const key = s.key + '_' + (qi+1);
        let ctrl = '';
        if (s.type === 'yesno') {
          ctrl = `<div class="opt-group" data-q="${key}">${L.yesNo.map(o=>`<div class="opt-btn${answers[key]===o?' sel':''}" data-v="${o}">${o}</div>`).join('')}</div>`;
        } else if (s.type === 'freq') {
          ctrl = `<div class="freq-group" data-q="${key}">${L.freq.map(o=>`<div class="freq-btn${answers[key]===o?' sel':''}" data-v="${o}">${o}</div>`).join('')}</div>`;
        } else if (s.type === 'scale') {
          ctrl = `<div class="scale-wrap" data-q="${key}">${L.scale.map(o=>`<div class="scale-btn${o==='N/A'||o==='Н/П'||o==='T/Y'?' np':''}${answers[key]===o?' sel':''}" data-v="${o}">${o}</div>`).join('')}</div><div class="scale-hint">${L.scaleHint}</div>`;
        }
        bodyHTML += `<div class="q-row"><div class="q-text"><span class="q-num">${qi+1}.</span>${q}</div>${ctrl}</div>`;
      });
    }

    const isFirst = i === 0, isLast = i === TOTAL - 1;
    const navLabel = L.sectionOf.replace('{n}', i+1);
    const submitOrNext = isLast
      ? `<button class="btn btn-primary" id="submitBtn" onclick="submitSurvey()">${L.submit}</button>`
      : `<button class="btn btn-primary" onclick="goNext(${i})">${L.next}</button>`;

    div.innerHTML = `
      <div class="card">
        <div class="card-header">
          <div class="card-badge">${s.badge}</div>
          <div class="card-title">${s.title}</div>
          <div class="card-desc">${s.desc}</div>
        </div>
        <div class="card-body">${bodyHTML}</div>
        ${isLast ? '<div class="err-banner" id="errBanner"></div>' : ''}
        <div class="card-nav">
          ${isFirst ? '<span></span>' : `<button class="btn" onclick="goBack(${i})">${L.back}</button>`}
          <span class="page-info">${navLabel}</span>
          ${submitOrNext}
        </div>
      </div>`;
    container.appendChild(div);
  });

  // Done screen
  const done = document.createElement('div');
  done.className = 'sheet';
  done.id = 'sheet-done';
  done.innerHTML = `<div class="done-card">
    <div class="done-icon"><svg width="32" height="32" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg></div>
    <div class="done-title">${L.doneTitle}</div>
    <p class="done-text">${L.doneText}</p>
    <div class="done-author">${L.doneAuthor.replace('\n','<br>')}</div>
  </div>`;
  container.appendChild(done);

  document.getElementById('sendingText').textContent = L.sending;
  updateProgress(0);
  attachEvents();
}

function attachEvents() {
  document.getElementById('sheetContainer').addEventListener('click', e => {
    const btn = e.target.closest('.opt-btn, .freq-btn, .scale-btn');
    if (!btn) return;
    const group = btn.parentElement;
    const q = group.dataset.q;
    if (!q) return;
    group.querySelectorAll('[data-v]').forEach(b => b.classList.remove('sel'));
    btn.classList.add('sel');
    answers[q] = btn.dataset.v;
  });
  document.getElementById('sheetContainer').addEventListener('input', e => {
    if (e.target.dataset.q) answers[e.target.dataset.q] = e.target.value.trim();
  });
}

function updateProgress(idx) {
  const L = T[lang];
  const pct = Math.round((idx + 1) / TOTAL * 100);
  document.getElementById('prog').style.width = (idx >= TOTAL ? 100 : pct) + '%';
  document.getElementById('progLabel').textContent = idx >= TOTAL ? L.completed : L.sectionOf.replace('{n}', idx+1);
  document.getElementById('progPct').textContent = (idx >= TOTAL ? 100 : pct) + '%';
}

function setSheet(idx) {
  document.querySelectorAll('.sheet').forEach(s => s.classList.remove('active'));
  const target = idx < TOTAL ? 'sheet-' + idx : 'sheet-done';
  document.getElementById(target).classList.add('active');
  currentSheet = idx;
  updateProgress(idx);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function goNext(from) { setSheet(from + 1); }
function goBack(from) { setSheet(from - 1); }

async function submitSurvey() {
  const L = T[lang];
  const btn = document.getElementById('submitBtn');
  const errBanner = document.getElementById('errBanner');
  if (errBanner) errBanner.classList.remove('show');
  if (SCRIPT_URL === 'ВСТАВЬТЕ_ВАШ_URL_СЮДА') { alert('Please set SCRIPT_URL in the code.'); return; }
  btn.disabled = true;
  document.getElementById('sendOverlay').classList.add('show');
  try {
    await fetch(SCRIPT_URL, { method:'POST', mode:'no-cors', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ answers, lang }) });
    document.getElementById('sendOverlay').classList.remove('show');
    setSheet(TOTAL);
  } catch(err) {
    document.getElementById('sendOverlay').classList.remove('show');
    btn.disabled = false;
    if (errBanner) { errBanner.textContent = L.errMsg; errBanner.classList.add('show'); }
  }
}
</script>
