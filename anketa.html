<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Анкета — Надёжность персонала железнодорожного транспорта</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* ── RESET & BASE ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --green: #0F6E56;
  --green-light: #E1F5EE;
  --green-mid: #1D9E75;
  --green-dark: #085041;
  --ink: #1a1a1a;
  --ink-muted: #555;
  --ink-hint: #999;
  --surface: #fff;
  --bg: #f5f3ef;
  --border: rgba(0,0,0,0.1);
  --border-hover: rgba(0,0,0,0.22);
  --radius: 10px;
  --shadow: 0 2px 12px rgba(0,0,0,0.07);
}
html { scroll-behavior: smooth; }
body {
  font-family: 'Geologica', sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  font-size: 15px;
  line-height: 1.6;
}

/* ── LAYOUT ── */
.page { max-width: 720px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }

/* ── HERO ── */
.hero {
  background: var(--green-dark);
  color: #fff;
  border-radius: 16px;
  padding: 2.5rem 2rem 2rem;
  margin-bottom: 2rem;
  position: relative;
  overflow: hidden;
}
.hero::before {
  content: '';
  position: absolute;
  right: -40px; top: -40px;
  width: 200px; height: 200px;
  background: rgba(255,255,255,0.04);
  border-radius: 50%;
}
.hero::after {
  content: '';
  position: absolute;
  right: 40px; top: 60px;
  width: 100px; height: 100px;
  background: rgba(255,255,255,0.04);
  border-radius: 50%;
}
.hero-label {
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.5);
  margin-bottom: 0.75rem;
}
.hero h1 {
  font-family: 'PT Serif', serif;
  font-size: clamp(18px, 4vw, 24px);
  font-weight: 400;
  line-height: 1.35;
  margin-bottom: 1rem;
  color: #fff;
}
.hero-sub {
  font-size: 13px;
  color: rgba(255,255,255,0.65);
  line-height: 1.6;
}
.hero-meta {
  margin-top: 1.5rem;
  padding-top: 1.5rem;
  border-top: 1px solid rgba(255,255,255,0.12);
  display: flex; gap: 1.5rem; flex-wrap: wrap;
}
.hero-chip {
  font-size: 12px;
  color: rgba(255,255,255,0.6);
  display: flex; align-items: center; gap: 5px;
}
.hero-chip svg { opacity: 0.7; }

/* ── PROGRESS ── */
.progress-wrap { margin-bottom: 1.5rem; }
.progress-label {
  display: flex; justify-content: space-between;
  font-size: 12px; color: var(--ink-hint);
  margin-bottom: 6px;
}
.progress-track {
  height: 3px;
  background: rgba(0,0,0,0.08);
  border-radius: 3px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--green-mid);
  border-radius: 3px;
  transition: width 0.5s cubic-bezier(.4,0,.2,1);
}

/* ── SHEET CARD ── */
.sheet { display: none; }
.sheet.active { display: block; }
.card {
  background: var(--surface);
  border-radius: 14px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  overflow: hidden;
}
.card-header {
  padding: 1.5rem 1.75rem 1.25rem;
  border-bottom: 1px solid var(--border);
}
.card-badge {
  display: inline-block;
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  background: var(--green-light);
  color: var(--green-dark);
  padding: 3px 10px;
  border-radius: 20px;
  margin-bottom: 8px;
  font-weight: 500;
}
.card-title {
  font-size: 16px;
  font-weight: 500;
  color: var(--ink);
  margin-bottom: 5px;
}
.card-desc {
  font-size: 13px;
  color: var(--ink-muted);
}
.card-body { padding: 0 1.75rem; }

/* ── QUESTION ROW ── */
.q-row {
  padding: 1rem 0;
  border-bottom: 1px solid rgba(0,0,0,0.06);
}
.q-row:last-child { border-bottom: none; }
.q-text {
  font-size: 13.5px;
  color: var(--ink);
  margin-bottom: 9px;
  line-height: 1.55;
}
.q-num { color: var(--ink-hint); margin-right: 4px; font-size: 12px; }

/* ── OPTION BUTTONS ── */
.opt-group { display: flex; flex-wrap: wrap; gap: 6px; }
.opt-btn {
  cursor: pointer;
  padding: 6px 13px;
  border: 1px solid var(--border-hover);
  border-radius: 20px;
  font-size: 12.5px;
  color: var(--ink-muted);
  background: transparent;
  font-family: 'Geologica', sans-serif;
  transition: all 0.15s;
  white-space: nowrap;
}
.opt-btn:hover { border-color: var(--green-mid); color: var(--green-dark); }
.opt-btn.sel {
  background: var(--green-light);
  border-color: var(--green);
  color: var(--green-dark);
  font-weight: 500;
}

/* ── SCALE BUTTONS ── */
.scale-wrap { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.scale-btn {
  cursor: pointer;
  width: 38px; height: 38px;
  border: 1px solid var(--border-hover);
  border-radius: 8px;
  font-size: 13px;
  font-weight: 500;
  color: var(--ink-muted);
  background: transparent;
  font-family: 'Geologica', sans-serif;
  transition: all 0.15s;
  display: flex; align-items: center; justify-content: center;
}
.scale-btn.np { font-size: 10px; width: auto; padding: 0 10px; }
.scale-btn:hover { border-color: var(--green-mid); color: var(--green-dark); }
.scale-btn.sel { background: var(--green-light); border-color: var(--green); color: var(--green-dark); }
.scale-hint {
  font-size: 11px; color: var(--ink-hint);
  margin-top: 5px;
}

/* ── FREQ BUTTONS ── */
.freq-group { display: flex; flex-wrap: wrap; gap: 5px; }
.freq-btn {
  cursor: pointer;
  padding: 5px 11px;
  border: 1px solid var(--border-hover);
  border-radius: 6px;
  font-size: 12px;
  color: var(--ink-muted);
  background: transparent;
  font-family: 'Geologica', sans-serif;
  transition: all 0.15s;
}
.freq-btn:hover { border-color: var(--green-mid); color: var(--green-dark); }
.freq-btn.sel { background: var(--green-light); border-color: var(--green); color: var(--green-dark); font-weight: 500; }

/* ── TEXT INPUT / TEXTAREA ── */
input[type=text], textarea {
  width: 100%;
  font-family: 'Geologica', sans-serif;
  font-size: 13.5px;
  color: var(--ink);
  background: #fafaf8;
  border: 1px solid var(--border-hover);
  border-radius: var(--radius);
  padding: 9px 12px;
  outline: none;
  transition: border-color 0.15s;
}
input[type=text]:focus, textarea:focus { border-color: var(--green-mid); background: #fff; }
textarea { min-height: 80px; resize: vertical; line-height: 1.6; }

/* ── NAVIGATION ── */
.card-nav {
  display: flex; align-items: center; justify-content: space-between;
  padding: 1.25rem 1.75rem;
  border-top: 1px solid var(--border);
  background: #fafaf8;
}
.page-info { font-size: 12px; color: var(--ink-hint); }
.btn {
  cursor: pointer;
  padding: 9px 22px;
  border-radius: 8px;
  font-size: 13.5px;
  font-family: 'Geologica', sans-serif;
  font-weight: 500;
  border: 1px solid var(--border-hover);
  background: transparent;
  color: var(--ink-muted);
  transition: all 0.15s;
}
.btn:hover { background: var(--bg); color: var(--ink); }
.btn-primary {
  background: var(--green);
  color: #fff;
  border-color: var(--green);
}
.btn-primary:hover { background: var(--green-dark); border-color: var(--green-dark); color: #fff; }
.btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

/* ── DONE SCREEN ── */
.done-card {
  background: var(--surface);
  border-radius: 14px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  padding: 3rem 2rem;
  text-align: center;
}
.done-icon {
  width: 64px; height: 64px;
  background: var(--green-light);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 1.5rem;
}
.done-icon svg { color: var(--green); }
.done-title {
  font-family: 'PT Serif', serif;
  font-size: 22px;
  margin-bottom: 0.75rem;
  color: var(--ink);
}
.done-text {
  font-size: 14px; color: var(--ink-muted);
  max-width: 380px; margin: 0 auto 1.5rem;
  line-height: 1.7;
}
.done-author {
  font-size: 12px; color: var(--ink-hint);
  font-style: italic;
  margin-top: 2rem;
  padding-top: 1.5rem;
  border-top: 1px solid var(--border);
}

/* ── SENDING STATE ── */
.sending-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(4px);
  z-index: 999;
  align-items: center; justify-content: center;
  flex-direction: column; gap: 1rem;
}
.sending-overlay.show { display: flex; }
.spinner {
  width: 36px; height: 36px;
  border: 3px solid var(--green-light);
  border-top-color: var(--green);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.sending-text { font-size: 14px; color: var(--green-dark); font-weight: 500; }

/* ── ERROR BANNER ── */
.err-banner {
  display: none;
  background: #fff0f0;
  border: 1px solid #fca5a5;
  border-radius: 8px;
  padding: 12px 16px;
  font-size: 13px;
  color: #991b1b;
  margin-top: 1rem;
}
.err-banner.show { display: block; }

/* ── CONFIG NOTE ── */
.config-note {
  background: #fffbeb;
  border: 1px solid #fcd34d;
  border-radius: 8px;
  padding: 12px 16px;
  font-size: 12.5px;
  color: #92400e;
  margin-bottom: 1.5rem;
  line-height: 1.6;
}
.config-note strong { font-weight: 600; }

@media (max-width: 500px) {
  .hero { padding: 1.75rem 1.25rem 1.5rem; }
  .card-body { padding: 0 1.25rem; }
  .card-header { padding: 1.25rem 1.25rem 1rem; }
  .card-nav { padding: 1rem 1.25rem; }
}
</style>
</head>

      'Тренажёрная подготовка с моделированием нештатных ситуаций',
      'Обязательный разбор происшествий и инцидентов с участием персонала',
      'Психофизиологическое тестирование перед сменой (тест Люшера, Спилбергера–Ханина, Шуберта)',
      'Чек-листы и карточки-напоминания для контроля критических операций',
      'Оптимизация интерфейсов автоматизированных рабочих мест (эргономичный дизайн АРМ)',
      'Совершенствование системы приёма и сдачи смены (стандартизированный протокол)',
      'Программы снижения стресса и психологической поддержки персонала',
      'Обучение методам управления ошибками (CRM — Crew Resource Management)',
      'Цифровые системы управления нарядами и маршрутами с исключением ручного ввода',
      'Аудит человеческого фактора (регулярные проверки соответствия рабочей среды требованиям безопасности)',
      'Анонимная система добровольного сообщения об ошибках (АСВН)'
    ]
  }
];

// ─── State ───
const answers = {};
let currentSheet = 0;
const TOTAL = 8;

// ─── Build dynamic sheets ───
SHEETS.forEach((s, i) => {
  const sheetNum = i + 1;
  const prevSheet = sheetNum;
  const nextSheet = sheetNum + 1;
  let bodyHTML = '';

  s.questions.forEach((q, qi) => {
    const qKey = s.key + '_' + (qi + 1);
    let controlHTML = '';

    if (s.type === 'yesno') {
      controlHTML = `<div class="opt-group" data-q="${qKey}">${yesNoOpts.map(o=>`<div class="opt-btn" data-v="${o}">${o}</div>`).join('')}</div>`;
    } else if (s.type === 'freq') {
      controlHTML = `<div class="freq-group" data-q="${qKey}">${freqOpts.map(o=>`<div class="freq-btn" data-v="${o}">${o}</div>`).join('')}</div>`;
    } else if (s.type === 'scale') {
      controlHTML = `<div class="scale-wrap" data-q="${qKey}">${scaleOpts.map(o=>`<div class="scale-btn${o==='Н/П'?' np':''}" data-v="${o}">${o}</div>`).join('')}</div>
      <div class="scale-hint">5 — отлично / очень высокая, 1 — плохо / очень низкая, Н/П — не применимо</div>`;
    }

    bodyHTML += `<div class="q-row">
      <div class="q-text"><span class="q-num">${qi+1}.</span>${q}</div>
      ${controlHTML}
    </div>`;
  });

  document.getElementById(s.id).innerHTML = `
    <div class="card">
      <div class="card-header">
        <div class="card-badge">${s.badge}</div>
        <div class="card-title">${s.title}</div>
        <div class="card-desc">${s.desc}</div>
      </div>
      <div class="card-body">${bodyHTML}</div>
      <div class="card-nav">
        <button class="btn" onclick="goBack(${sheetNum})">← Назад</button>
        <span class="page-info">Раздел ${sheetNum + 1} из ${TOTAL}</span>
        <button class="btn btn-primary" onclick="goNext(${sheetNum})">Далее →</button>
      </div>
    </div>`;
});

// ─── Click handlers ───
document.addEventListener('click', e => {
  const btn = e.target.closest('.opt-btn, .freq-btn, .scale-btn');
  if (!btn) return;
  const group = btn.parentElement;
  const q = group.dataset.q;
  if (!q) return;
  group.querySelectorAll('[data-v]').forEach(b => b.classList.remove('sel'));
  btn.classList.add('sel');
  answers[q] = btn.dataset.v;
});

document.addEventListener('input', e => {
  if (e.target.dataset.q) answers[e.target.dataset.q] = e.target.value.trim();
});

// ─── Navigation ───
function setSheet(idx) {
  document.querySelectorAll('.sheet').forEach(s => s.classList.remove('active'));
  const target = idx < TOTAL ? 'sheet-' + idx : 'sheet-done';
  document.getElementById(target).classList.add('active');
  currentSheet = idx;

  if (idx < TOTAL) {
    const pct = Math.round((idx + 1) / TOTAL * 100);
    document.getElementById('prog').style.width = pct + '%';
    document.getElementById('progLabel').textContent = `Раздел ${idx + 1} из ${TOTAL}`;
    document.getElementById('progPct').textContent = pct + '%';
  } else {
    document.getElementById('prog').style.width = '100%';
    document.getElementById('progLabel').textContent = 'Завершено';
    document.getElementById('progPct').textContent = '100%';
  }
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function goNext(from) { setSheet(from + 1); }
function goBack(from) { setSheet(from - 1); }

// ─── Submit ───
async function submitSurvey() {
  const btn = document.getElementById('submitBtn');
  const errBanner = document.getElementById('errBanner');
  errBanner.classList.remove('show');

  if (SCRIPT_URL === 'ВСТАВЬТЕ_ВАШ_URL_СЮДА') {
    alert('Пожалуйста, вставьте URL вашего Apps Script в переменную SCRIPT_URL в коде анкеты.');
    return;
  }

  btn.disabled = true;
  document.getElementById('sendOverlay').classList.add('show');

  try {
    await fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ answers })
    });
    document.getElementById('sendOverlay').classList.remove('show');
    setSheet(TOTAL);
  } catch (err) {
    document.getElementById('sendOverlay').classList.remove('show');
    btn.disabled = false;
    errBanner.classList.add('show');
  }
}
</script>
</body>
</html>
